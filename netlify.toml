# Configuration Netlify pour Studio DAW

# Dossier de publication (racine du projet)
publish = "."

# Commande de build (aucune compilation nécessaire)
# Le projet utilise uniquement HTML, CSS et JavaScript natif
build = {}

# Redirections
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# En-têtes HTTP
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://fonts.googleapis.com; media-src 'self';"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

# Variables d'environnement
[build.environment]
  NODE_VERSION = "18"

# Configuration du déploiement
[build]
  command = "echo 'Aucune compilation nécessaire - projet statique'"
